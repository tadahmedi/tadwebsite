<!DOCTYPE html>
<html>
<head>
    <title>Kafeneja Jone - Rezervo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Ballina</a>
            <a href="menu.html">Menuja</a>
            <a href="booking.html" class="active">Rezervo</a>
        </nav>
    </header>

    <main class="page-content">
        <h2>Rezervo Tavolinën Tënde</h2>
        <form class="booking-form">
            <label>Emri dhe Mbiemri:</label>
            <input type="text" placeholder="Shkruaj emrin tënd" required>

            <label>Numri i Telefonit:</label>
            <input type="tel" placeholder="04X XXX XXX" required>

            <label>Numri i Personave:</label>
            <input type="number" min="1" max="10" value="2" required>

            <label>Data dhe Ora:</label>
            <input type="datetime-local" required>

            <button type="submit" class="btn">Konfirmo Rezervimin</button>
        </form>
    </main>

</body>
</html>
